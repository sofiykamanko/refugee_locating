[project]
name = "refugee_location_matching"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "fonttools<4.69",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pytest>=9.2.0",
]
